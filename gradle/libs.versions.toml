[versions]
lombok = "1.18.38"
slf4j = "2.0.17"
logback = "1.5.18"
junit = "5.13.4"
mockito = "5.18.0"
assertj = "3.27.3"
archunit = '1.3.0'
classgraph = '4.8.126'

[libraries]
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

slf4j-api = { module = 'org.slf4j:slf4j-api', version.ref = "slf4j" }
logback = { module = "ch.qos.logback:logback-core", version.ref = "logback" }

junit-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-params = { module = "org.junit.jupiter:junit-jupiter-params" }
junit-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit-platform = { module = "org.junit.platform:junit-platform-launcher" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
classgraph = { module = "io.github.classgraph:classgraph", version.ref = "classgraph" }
archunit = { module = 'com.tngtech.archunit:archunit-junit5', version.ref = "archunit" }

[plugins]